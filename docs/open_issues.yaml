# 미해결 과제 — 사람이 손으로 관리하는 유일한 CANONICAL 입력.
#
# docs/CANONICAL.md 는 자동 생성이라 손대면 안 된다. 그런데 "미해결 과제"만은
# 어떤 산출물에서도 유도할 수 없는 사람의 판단이다. 그래서 편집 대상을 **출력이 아니라
# 입력으로** 옮겼다 — 여기를 고치면 CANONICAL 이 따라 바뀐다.
#
# 필드
#   id       : 짧은 식별자 (대문자-하이픈). 문서 간 상호 참조에 쓴다.
#   status   : open | blocked
#              **해소되면 항목을 지운다.** 이 파일은 이름 그대로 열린 과제만 담는다 —
#              해소 기록은 git 이력과 해당 SPEC 절에 남는다.
#   severity : high | medium | low
#   summary  : 한 줄. **수치를 적지 마라** — 낡는다. 산출물이 가진 값은 CANONICAL 이 찍는다.
#   ref      : 근거 문서 경로 (있으면)

issues:
  - id: G5-MDD
    status: open
    severity: high
    summary: 일별 net MDD 가 SPEC_10 G5 한계선을 위반한다. 종목 수 축으로는 풀리지 않는다 —
             구간간 표준편차가 n 을 늘려도 이론값(1/√n)만큼 줄지 않아 전 종목이 같은 저PBR
             팩터에 물려 있다 (n=1..20 곡선은 tape 절단 산출).
    ref: experiments/analysis/n_stocks_curve.json

  - id: SECTOR-DATA
    status: open
    severity: high
    summary: 섹터 분류 데이터가 전무해 업종 집중도를 측정할 수 없다. 낙폭 원인 규명의 최대
             병목이다 (pykrx 섹터 API 불작동 → DB 수동 입력 외 수단 없음).
    ref: docs/검토/f_pbr_ma200_median_split.md

  - id: TAPE-ASYNC
    status: open
    severity: medium
    summary: run_ablation 이 지표를 갱신해도 대응 holdings tape 은 그대로다. tape 에 생성
             시각·코드 SHA·소스 지표 해시가 없어 소비처가 stale 을 감지할 수단이 없다.
             tape 자체가 없는 태그도 있다.
    ref: docs/설계/[이슈] 모멘텀필터_coverage_gate_미구현.md

  - id: CORR-GATE-003
    status: open
    severity: medium
    summary: universe_gate_pit 의 PK 에 시점 차원이 없어 정정 공시 이후 시점에는 게이트 판정이
             stale 하다.
    ref: docs/설계/SPEC_06_phases.md

  - id: SNAPSHOT-MARKET-FALLBACK
    status: open
    severity: medium
    summary: krx_daily_snapshot 이 멈춘 구간에서는 신규 상장 종목이 스냅샷에 없어
             get_markets 가 stocks.market 로 조용히 대체되고, 시장 미상이면 KOSPI 기본
             매도요율이 붙는다. 없으면 기본값으로 조용히 대체되는 이 저장소의 반복 패턴이다.
             거래비용 산출에만 쓰이므로 판정을 바꾸지는 않으나, 스냅샷 정지가 이어지면
             신규 상장이 쌓이며 잘못된 비용이 누적된다.
    ref: backtest/data_access.py

  - id: RULE-SILENT-PASS
    status: open
    severity: low
    summary: R3·R4 는 fail-closed 로 닫혔고 나머지 네 규칙은 **선언된 정책**으로 여전히
             결측을 통과시킨다. 이제 숨은 결함이 아니라 사전등록된 ablation 대상이다 —
             정책을 뒤집으면 유니버스가 줄어 수익률 축이 함께 움직이므로 대조군 없이
             바꾸면 안 된다. 범위는 property test 가 고정한다.
    ref: tests/oracle/test_fail_closed_property.py

  - id: MKTCAP-FDR-FALLBACK
    status: open
    severity: low
    summary: market_cap_history 일부 행이 FDR **현재** 주식수를 과거에 소급해 만든 값이라
             재수집 때마다 달라진다. 시총은 랭킹의 분자다. 현재 L2 유니버스에 닿는 것은
             없다고 실측됐으나 그것은 오늘 기준이며, 커버리지 산출물의 고정 필드로
             상시 노출시켜 두었다.
    ref: experiments/analysis/2026.08.22._mktcap_reproducibility/

  - id: ADJ-CLOSE-MANUAL-CORRECTION-UNTRACKED
    status: open
    severity: medium
    summary: 과거 수정주가 보정이 사람 판단으로 DB 에 직접 반영됐고 코드·마이그레이션에
             남아 있지 않다. price_history 를 재구축하면 그 보정이 조용히 사라져 RIM
             유효성 판정이 되돌아간다. 보정 근거와 대상을 재적용 가능한 형태로 옮겨야 한다.
    ref: docs/검토/2026.08.22._DATA_INTEGRITY_CLOSEOUT.md

  - id: SOURCE-NOTE-NAN-CAST
    status: open
    severity: medium
    summary: delisting_ingest 가 pandas NaN 을 str() 로 감싸 상폐 사유가 문자열 "nan" 으로
             적재된다. 결측이 결측으로 표현되지 않고 값처럼 보이는 유형 —
             factor_screener 의 결측 -> 최하위 백분위와 같은 구조다.
             **단독으로 고치지 마라** — v10 유니크 키가 source_note 를 포함하는데,
             "nan" 을 NULL 로 바꾸면 Postgres UNIQUE 가 NULL 을 서로 다르게 취급해
             제약이 조용히 무력화된다. NULL 전환과 COALESCE 기반 부분 인덱스 추가를
             반드시 한 세트로 처리한다.
    ref: ingest/delisting_ingest.py

  - id: INGEST-CRON-GAPS
    status: open
    severity: medium
    summary: 적재 경로 9개 중 6개가 crontab 에 등록돼 있지 않다 (DART 재무·공시, PIT 재무,
             DQ 게이트, KRX 상장 스냅샷, KRX 일별 스냅샷, 검증 로그). 상폐 이벤트가
             3개월 반 멈춘 것과 같은 구조의 사고가 재발할 수 있다. 각 경로가 수동 실행이
             맞는지, 자동화 대상인지 판단이 필요하다.
    ref: experiments/analysis/2026.08.19._trade_halt_impact/ingest_coverage.csv

  - id: TAGMATRIX-MOMENTUM-LABEL-COLLISION
    status: open
    severity: low
    summary: 모멘텀 열 이름이 태그마다 유일해야 한다는 단언이 안정성 축 변형에서 깨진다.
             모멘텀 규칙이 같은 두 태그는 같은 이름이 나오는 것이 맞으므로 결함은 표시
             쪽이 아니라 단언 쪽일 수 있다. 이름에 축을 덧붙일지 단언을 완화할지는
             사람이 판단한다 — 테스트를 통과시키려고 먼저 고치지 마라.
    ref: tests/integrity/test_series_view.py

  - id: SUMMARY-JSON-STALE
    status: open
    severity: medium
    summary: CANONICAL 이 읽는 성적·게이트 표는 2026-08-29 에 등재 산출물 조립 경로로 옮겼다 —
             그 세 파일은 더 이상 run_ablation 요약 JSON 에서 오지 않는다. 남은 범위는 셋이다.
             ① ablation/summary.json 은 시나리오 전체와 judgements 블록이 폐기 세대 그대로다
             (CANONICAL 은 여기서 수치를 읽지 않고 키 존재만 본다. 한 키만 갈아 끼우면
             judgements 와 어긋난 혼합물이 되어 손대지 않았다). ② daily_nav/summary.json 은
             현행 채택안 태그만 조립분이고 나머지 태그는 폐기 세대다 — 파일 안 _composed
             블록이 어느 키가 어느 세대인지 명시한다. ③ 폐기 세대 차단이 여전히 **경로 기반**
             이라, 그 경로에 조립분이 놓인 지금도 가드는 무장한 채다. 경로만으로는 조립분과
             재오염분을 구분할 수 없으므로 과잉 차단 쪽으로 두었다. 잔여 범위의 목록은
             experiments/BASELINES.json 의 _status_20260829_composed 에 있다.
    ref: experiments/runs/2026.08.29._CANONICAL_COMPOSE.md

  - id: ABLATION-REPRO-DRIFT-2024
    status: open
    severity: medium
    summary: 같은 코드·같은 섀도우 DB 로 tape 을 재생성하면 2024 이후 구간에서 필터 통과 종목
             수가 줄어든다. 수익률 컬럼은 전 구간 동일해 성과 수치는 움직이지 않았고, 그래서
             등재 기준선을 바꾸지는 않았다. 원인 미규명 — MOMENTUM-DRIFT-016600 과 같은
             지문일 수 있으나 확인하지 않았다. 종목 단위로 규명하려면 현행 세대의 커버리지
             산출물이 대조 상대로 필요해, 그 파일을 experiments/analysis/2026.08.29._plumbing/
             에 보존해 두었다 (README 에 용도 명시 — 정리 대상으로 오인하지 마라).
    ref: experiments/analysis/2026.08.29._plumbing/README.md

  - id: NAME-BASED-TYPE-DETECTION
    status: open
    severity: low
    summary: 파일·레코드의 종류를 이름·접미사·패턴 매칭으로 판정하는 코드가 남아 있다. 이
             저장소에서 같은 유형으로 다섯 번 틀렸다 — H1 결측 서명 오독, amount 변동을 정정으로
             오독, 파일명 접미사로 요약 JSON 계열 오독, 이름 기반 금지 검사기가 이름 기반이었던
             것, 그리고 file_digest 가 확장자로 텍스트·이진을 갈라 이진 등재 입력의 해시를
             재현하지 못한 것. 전부 내용 기반 판별자로 고쳐졌다.
             2026-08-29 에 **활성 위험 지점 하나가 닫혔다** — 폐기 세대 차단이 경로 집합
             비교에서 내용 판정(scripts/analysis/generation)으로 바뀌어, 조립분 경로에
             재실행 산출이 앉는 경로를 잡는다. 같은 세션에서 file_digest 도 내용 기반으로
             바꿨다. 남은 미점검 지점 셋은 오분류해도 조용한 오염 경로가 없어 순위가 낮다 —
             canonical_state.collect 의 키 조립(f-string 태그 이름), dashboard/series.py 의
             UNCOVERED 계열 분류, ingest 계열의 account_nm suffix 처리.
    ref: experiments/runs/2026.08.29._GENERATION_BY_CONTENT.md

  - id: XSEC-GATE-COMBINATION-RULE
    status: blocked
    severity: medium
    summary: SPEC_15 사전등록이 게이트 셋을 나열했으나 셋을 하나의 PASS/FAIL 로 합치는 규칙을
             적지 않았고, 조합별 해석표는 그 단일 판정을 키로 쓴다. 본 측정에서 게이트 하나가
             나머지와 갈려 공백이 실제로 문제가 됐다. 두 읽기(primary 게이트만 / 전부 충족)가
             각각 다른 행을 가리키지만 **두 행의 다음 행동은 같다** — 채택도 폐기도 하지
             않는다. 그래서 결과를 본 뒤 임의로 고르지 않고 남긴다. 다음 SPEC 은 게이트 결합
             규칙을 사전등록에 명시해야 한다.
    ref: experiments/runs/2026.08.26._XSEC_OFFICIAL.md

  - id: MOMENTUM-DRIFT-016600
    status: open
    severity: medium
    summary: 상폐되지 않은 종목 하나의 모멘텀 판정이 두 구간에서 바뀌었다. 같은 코드·같은
             섀도우 DB 로 며칠 간격을 두고 tape 을 재생성했을 때 드러났고, 편입 종목은
             전 구간 동일해 성과 수치는 움직이지 않았다. 등재 기준선에 이미 반영된 상태다.
             모멘텀은 가격 이력에 의존하므로 소스가 과거를 회수하는 중이라면 같은 유형이
             더 있을 수 있다 — 데이터 지평 절의 세 번째 축이 활성이라는 신호일 수 있으나
             실측하지 않았다. 원인 규명 전에는 재현성 주장을 종목 단위로 하지 마라.
             2026-08-29 재현 대조에서 같은 지문이 다시 나왔다 — 수익률은 안 움직이는데
             필터 통과 개수만 최근 구간에서 감소했다. 한 건일 가능성이 있으나 확인하지 않았다.
             그 관측은 ABLATION-REPRO-DRIFT-2024 로 따로 등재했다. 두 항목이 같은 원인인지도
             아직 모른다 — 같다고 가정하고 한쪽만 규명하지 마라.
    ref: experiments/runs/2026.08.29._PLUMBING.md

  - id: DOTENV-CWD-SILENT-5433
    status: open
    severity: high
    summary: 워크트리 밖(예 /tmp)에서 실행된 스크립트는 load_dotenv 가 그 워크트리의 .env 를
             찾지 못하고, get_connection 이 선언 없이 운영 DB 기본값으로 붙는다. 섀도우
             실험 중 운영 DB 에 접속하는 경로이며, 실패하지 않고 조용히 성공하기 때문에
             결과가 오염돼도 드러나지 않는다. 2026-08-25 에 assert 로 한 번 걸렸다.
             기본값을 두지 말고 미설정 시 예외를 던지게 하는 것이 근본 대책이다.
    ref: ingest/connection.py

  - id: RF-ERP-SENS
    status: open
    severity: low
    summary: 할인율 r 이 고정값이라 출처가 불명확하고, 저금리 구간에서 기업가치를 과대 추정할
             위험이 있다. 민감도 분석 미실시.
    ref: docs/설계/SPEC_04_models.md
